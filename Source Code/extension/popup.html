<!DOCTYPE html>
<html>

<head>
    <title>Traction</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 350px;
            margin: 0;
            padding: 20px;
            background-color: #f9fafb;
            color: #111827;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .logo {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #2563eb, #9333ea);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: white;
            color: #111827;
            transition: all 0.2s;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        input::placeholder {
            color: #9ca3af;
        }

        .btn-primary {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: 1px solid transparent;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-primary:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
        }

        .hidden {
            display: none !important;
        }

        /* Dark Mode */
        body.dark {
            background-color: #111827;
            color: #f9fafb;
        }

        body.dark h2 {
            background: linear-gradient(to right, #60a5fa, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.dark label {
            color: #d1d5db;
        }

        body.dark input,
        body.dark select {
            background-color: #1f2937;
            border-color: #374151;
            color: #f9fafb;
            box-shadow: none;
        }

        body.dark input:focus,
        body.dark select:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }

        body.dark input::placeholder {
            color: #6b7280;
        }

        body.dark .btn-secondary {
            background-color: #374151;
            color: #e5e7eb;
            border-color: #4b5563;
        }

        body.dark .btn-secondary:hover {
            background-color: #4b5563;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            /* Push to right */
        }

        .icon-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
            color: #111827;
        }

        body.dark .icon-btn {
            color: #9ca3af;
        }

        body.dark .icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #f9fafb;
        }

        body.dark .card {
            background: #1f2937;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
        }

        body.dark .auth-toggle {
            color: #9ca3af;
        }

        body.dark .auth-toggle:hover {
            color: #f9fafb;
        }

        body.dark .btn-google {
            background-color: #374151;
            color: #f9fafb;
            border-color: #4b5563;
        }

        body.dark .btn-google:hover {
            background-color: #4b5563;
            border-color: #6b7280;
        }

        body.dark .divider {
            color: #6b7280;
        }

        body.dark .divider::before,
        body.dark .divider::after {
            border-bottom-color: #374151;
        }

        body.dark .alert-success {
            background-color: #064e3b;
            color: #34d399;
            border-color: #065f46;
        }

        body.dark .alert-error {
            background-color: #7f1d1d;
            color: #fca5a5;
            border-color: #991b1b;
        }

        body.dark #logout-btn {
            color: #9ca3af !important;
        }

        body.dark #logout-btn:hover {
            color: #f9fafb !important;
        }

        body.dark h3 {
            color: #f9fafb !important;
        }

        body.dark p {
            color: #9ca3af !important;
        }

        .alert-success {
            padding: 12px;
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .alert-error {
            padding: 12px;
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 16px;
        }

        .auth-view {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: white;
            padding: 24px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin: -4px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .auth-toggle {
            font-size: 13px;
            color: #6b7280;
            text-align: center;
            cursor: pointer;
            margin-top: 12px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .auth-toggle:hover {
            color: #111827;
        }

        .btn-google {
            width: 100%;
            background-color: white;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .btn-google:hover {
            background-color: #f9fafb;
            border-color: #d1d5db;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin: 4px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }

        .divider:not(:empty)::before {
            margin-right: .75em;
        }

        .divider:not(:empty)::after {
            margin-left: .75em;
        }
    </style>
</head>

<body>
    <div id="auth-view" class="auth-view hidden">
        <div class="header" style="justify-content: center; margin-bottom: 8px;">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                    style="width: 100%; height: 100%; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.05));">
                    <defs>
                        <linearGradient id="chevron-grad" x1="0" y1="0" x2="0" y2="24" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#2563EB" />
                            <stop offset="100%" stop-color="#9333EA" />
                        </linearGradient>
                    </defs>
                    <path d="M12 0 L0 10 L4.8 10 L12 4 L19.2 10 L24 10 Z" fill="url(#chevron-grad)" />
                    <path d="M12 7 L0 17 L4.8 17 L12 11 L19.2 17 L24 17 Z" fill="url(#chevron-grad)" />
                    <path d="M12 14 L0 24 L4.8 24 L12 18 L19.2 24 L24 24 Z" fill="url(#chevron-grad)" />
                </svg>
            </div>
            <h2>Traction</h2>
        </div>

        <div class="card">
            <div id="auth-error-msg" class="alert-error hidden"></div>

            <button id="btn-google" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Continue with Google
            </button>

            <div class="divider">or</div>

            <div class="form-group" style="margin-bottom: 0;">
                <label>Email</label>
                <input type="email" id="auth-email" placeholder="Enter Email">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Password</label>
                <input type="password" id="auth-password" placeholder="Enter Password">
            </div>

            <button id="btn-auth-submit" class="btn-primary" style="margin-top: 8px;">Sign In</button>

            <div id="auth-toggle" class="auth-toggle">Don't have an account? Sign up</div>
        </div>
    </div>

    <div id="main-view" class="hidden">
        <div class="header" style="justify-content: space-between; margin-bottom: 20px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        style="width: 100%; height: 100%; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.05));">
                        <defs>
                            <linearGradient id="chevron-grad2" x1="0" y1="0" x2="0" y2="24"
                                gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#2563EB" />
                                <stop offset="100%" stop-color="#9333EA" />
                            </linearGradient>
                        </defs>
                        <path d="M12 0 L0 10 L4.8 10 L12 4 L19.2 10 L24 10 Z" fill="url(#chevron-grad2)" />
                        <path d="M12 7 L0 17 L4.8 17 L12 11 L19.2 17 L24 17 Z" fill="url(#chevron-grad2)" />
                        <path d="M12 14 L0 24 L4.8 24 L12 18 L19.2 24 L24 24 Z" fill="url(#chevron-grad2)" />
                    </svg>
                </div>
                <h2>Traction</h2>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="theme-toggle" class="icon-btn" title="Toggle Dark Mode">
                    <svg class="sun-icon hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button id="logout-btn"
                    style="background: none; border: none; cursor: pointer; color: #6b7280; font-size: 13px; font-weight: 500; transition: color 0.2s;">Logout</button>
            </div>
        </div>

        <div class="card">
            <div id="error-msg" class="alert-error hidden"></div>

            <div class="form-group" style="margin-bottom: 0;">
                <label>Company</label>
                <input type="text" id="company" placeholder="e.g. Google">
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label>Job Title</label>
                <input type="text" id="title" placeholder="e.g. Software Engineer">
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label>Location</label>
                <input type="text" id="location" placeholder="e.g. San Francisco, CA">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Status</label>
                    <select id="status">
                        <option value="Wishlist">Wishlist</option>
                        <option value="Applied" selected>Applied</option>
                        <option value="Interviewing">Interviewing</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label>Priority</label>
                    <select id="priority">
                        <option value="High">High</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
            </div>

            <input type="hidden" id="link">

            <button id="save-btn" class="btn-primary" style="margin-top: 8px;">Save Application</button>
        </div>
    </div>

    <div id="success-view" class="hidden">
        <div class="header" style="justify-content: center; margin-bottom: 20px;">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                    style="width: 100%; height: 100%; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.05));">
                    <defs>
                        <linearGradient id="chevron-grad3" x1="0" y1="0" x2="0" y2="24" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#2563EB" />
                            <stop offset="100%" stop-color="#9333EA" />
                        </linearGradient>
                    </defs>
                    <path d="M12 0 L0 10 L4.8 10 L12 4 L19.2 10 L24 10 Z" fill="url(#chevron-grad3)" />
                    <path d="M12 7 L0 17 L4.8 17 L12 11 L19.2 17 L24 17 Z" fill="url(#chevron-grad3)" />
                    <path d="M12 14 L0 24 L4.8 24 L12 18 L19.2 24 L24 24 Z" fill="url(#chevron-grad3)" />
                </svg>
            </div>
            <h2>Traction</h2>
        </div>
        <div class="card" style="text-align: center; padding: 32px 20px;">
            <div
                style="width: 48px; height: 48px; background-color: #ecfdf5; color: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h3 style="margin: 0 0 8px; font-size: 16px; font-weight: 600; color: #111827;">Application Saved!</h3>
            <p style="margin: 0 0 20px; font-size: 14px; color: #6b7280;">Your job application has been successfully
                added to Traction.</p>
            <button id="close-btn" class="btn-primary">Close Window</button>
        </div>
    </div>

    <!-- Scripts must be loaded in this order -->
    <!-- Load Firebase SDK explicitly as scripts (modules aren't natively supported in all ext contexts easily out the box) -->
    <script src="firebase-app-compat.js"></script>
    <script src="firebase-firestore-compat.js"></script>
    <script src="firebase-auth-compat.js"></script>
    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>

</html>
