<!DOCTYPE html>
<html>

<head>
    <title>Traction</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 320px;
            margin: 0;
            padding: 16px;
            background-color: #f9fafb;
            color: #111827;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .logo {
            width: 24px;
            height: 24px;
            background-color: #4f46e5;
            color: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #4b5563;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
            background-color: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 1px #4f46e5;
        }

        .btn-primary {
            width: 100%;
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #4338ca;
        }

        .btn-primary:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        .alert-success {
            padding: 12px;
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }

        .alert-error {
            padding: 12px;
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <div id="main-view">
        <div class="header" style="justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div class="logo">T</div>
                <h2>Traction</h2>
            </div>
            <button id="settings-toggle"
                style="background: none; border: none; cursor: pointer; color: #6b7280;">⚙️</button>
        </div>

        <div id="error-msg" class="alert-error hidden"></div>

        <div id="settings-view" class="hidden"
            style="margin-bottom: 16px; padding: 12px; background: #e0e7ff; border-radius: 6px;">
            <label style="color: #4338ca;">Your Account UID (From Dashboard)</label>
            <input type="text" id="user-uid" placeholder="Paste UID here to link account"
                style="margin-top: 4px; font-size: 11px;">
            <p style="font-size: 10px; color: #4f46e5; margin-top: 4px; margin-bottom: 0;">This ensures saved jobs
                appear in your web app.</p>
        </div>

        <div class="form-group">
            <label>Company</label>
            <input type="text" id="company" placeholder="e.g. Google">
        </div>

        <div class="form-group">
            <label>Job Title</label>
            <input type="text" id="title" placeholder="e.g. Software Engineer">
        </div>

        <div class="form-group">
            <label>Location</label>
            <input type="text" id="location" placeholder="e.g. San Francisco, CA">
        </div>

        <div class="form-group">
            <label>Priority</label>
            <select id="priority">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
            </select>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select id="status">
                <option value="Wishlist">Wishlist</option>
                <option value="Applied" selected>Applied</option>
                <option value="Interviewing">Interviewing</option>
            </select>
        </div>

        <input type="hidden" id="link">

        <button id="save-btn" class="btn-primary">Save this application</button>
    </div>

    <div id="success-view" class="hidden">
        <div class="alert-success">
            Job application saved successfully!
        </div>
        <button id="close-btn" class="btn-primary" style="margin-top: 16px;">Close Window</button>
    </div>

    <!-- Scripts must be loaded in this order -->
    <!-- Load Firebase SDK explicitly as scripts (modules aren't natively supported in all ext contexts easily out the box) -->
    <script src="firebase-app-compat.js"></script>
    <script src="firebase-firestore-compat.js"></script>
    <script src="firebase-auth-compat.js"></script>
    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>

</html>
