# Traction collector config.
# Copy to /etc/traction-collector/config.yaml (the install script does this) and edit.
# Regex fragments below are matched case-insensitively as whole words.

traction:
  user_id: ""                       # your Firebase Auth UID (Firebase console > Authentication > Users)
  service_account: /etc/traction-collector/service-account.json
  app_url: https://traction-37.web.app   # used for links in the digest

settings:
  db_path: /var/lib/traction-collector/state.db
  report_dir: /var/lib/traction-collector
  min_score: 60            # roles below this never reach Traction
  notify_min_score: 70     # roles at or above this go in the push digest
  max_new_per_run: 600     # cap on brand-new Discover cards per run
  followup_days: 7         # nudge about "Applied" jobs older than this
  workday_queries: ["intern", "new grad", "university graduate", "early career"]
  screen:
    enabled: true
    min_prescore: 45       # only read JDs for roles that could plausibly make the cut
    max_per_run: 200
    workers: 6
    recheck_days: 14

notify:
  webhook: ""              # optional: Discord webhook URL or https://ntfy.sh/<your-topic>

# ---------------------------------------------------------------------------
# Who this is for. Tune these to the applicant.
# ---------------------------------------------------------------------------
profile:
  graduation: 2027-12
  internship_terms: ["Summer 2027"]
  part_time_terms: ["Fall 2027"]          # final semester: part-time pre-OPT only
  unavailable_terms: ["Summer 2026", "Fall 2026", "Winter 2026", "Spring 2027", "Winter 2027", "Spring 2026"]
  newgrad_open_from: 2027-05-01          # before this, new-grad roles mostly start too early
  grad_window_ok: ["December 2027", "Dec 2027", "Dec. 2027", "Fall 2027", "Winter 2027", "2028"]
  grad_window_bad: ["May 2027", "June 2027", "Spring 2027", "Summer 2027", "December 2026", "Dec 2026", "2026"]
  home_region: ["AZ", "Arizona", "Phoenix", "Tempe", "Chandler", "Scottsdale", "Mesa", "Gilbert",
                "Glendale", "Peoria", "Goodyear", "Tucson", "Casa Grande"]
  roles:
    core: [embedded, firmware, fpga, asic, soc, silicon, "pre-silicon", "post-silicon", rtl, vlsi,
           verification, validation, hardware, electrical, electronics, pcb, "board design", iot,
           robotics, mechatronics, "systems engineer\\w*", "test engineer\\w*", "product engineer\\w*",
           semiconductor, "digital design", "signal integrity", "power electronics", "controls?",
           autonomy, autonomous, "sensors?", wireless, rf, kernel, "device drivers?", bsp,
           "linux", automotive, avionics, "computer engineer\\w*", "edge"]
    strong: [software, swe, sde, "developers?", "back[- ]?end", "full[- ]?stack", "front[- ]?end",
             platform, infrastructure, devops, "site reliability", sre, cloud, security,
             "cyber\\w*", "network\\w*", tooling, "test automation", "release", mobile, android,
             ios, web, "systems"]
    ok: [data, "machine learning", ml, ai, "computer vision", analytics, "deep learning",
         "research engineer\\w*"]
    avoid: ["product manag\\w*", "program manag\\w*", "project manag\\w*", "quant\\w*", trading,
            "traders?", sales, marketing, finance, accounting, business, "recruit\\w*",
            "human resources", legal, ux, graphic, "supply chain", mechanical, civil, chemical,
            "process engineer\\w*", "manufacturing engineer\\w*", facilities, industrial, "actuar\\w*",
            "investment", "consult\\w*", "audit\\w*", "tax"]
  companies:
    warm: ["Example Corp", "Another Company"]   # companies where you have a contact or referral
    cap_exempt: ["Arizona State University", "University", "Mayo Clinic"]
    target: [Microchip, NXP, onsemi, Intel, TSMC, "Taiwan Semiconductor", Amkor, "Analog Devices",
             Marvell, Micron, "Texas Instruments", GlobalFoundries, Qualcomm, Garmin, Bosch, Arm,
             "Lucid Motors", Rivian, Tesla, Zoox, Waymo, "Cirrus Logic", "Western Digital", Cadence,
             Synopsys, "Motorola Solutions", Axon, GoDaddy, NVIDIA, AMD, Apple, Microsoft, Google,
             Amazon, Cisco, Broadcom, Medtronic, Keysight, Infineon, Qorvo, "General Motors"]
    defense: [RTX, Raytheon, Lockheed, Northrop, "General Dynamics", L3Harris, Anduril, Boeing,
              "BAE Systems", Leidos, SAIC, "Booz Allen", CACI, MITRE, Sandia, "Los Alamos",
              "Lawrence Livermore", "Applied Physics Lab\\w*", "JHU APL", "Huntington Ingalls",
              Textron, "Sierra Nevada", "Shield AI", "Collins Aerospace", "Pratt", Peraton,
              ManTech, Parsons, "Ensign-Bickford Aerospace", Nightwing, IntelliGenesis,
              Intelliforce, "General Atomics", "Honeywell Aerospace"]

